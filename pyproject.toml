[project]
name = "maidere"
version = "0.1.0"
description = "A fully free, self-hosted autonomous AI agent"
readme = "README.md"
authors = [
    { name = "Khazar451", email = "emperorkhazar1299@gmail.com" }
]
urls = { Repository = "https://github.com/Khazar451/maidere" }
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=3.10.4",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langchain-core>=0.3.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "numpy>=2.5.2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.0",
    "sqlalchemy>=2.0.0",
    "sqlite-vec>=0.1.9",
    "structlog>=26.1.0",
    "uvicorn>=0.52.4",
    "prometheus-client>=0.20.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "python-multipart>=0.0.20",
]



[project.scripts]
maidere = "maidere:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
