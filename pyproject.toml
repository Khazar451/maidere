[project]
name = "maidere"
version = "0.1.0"
description = "A fully free, self-hosted autonomous AI agent"
readme = "README.md"
authors = [
    { name = "Khazar451", email = "https://github.com/Khazar451" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "numpy>=2.5.2",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlite-vec>=0.1.9",
    "structlog>=26.1.0",
    "uvicorn>=0.52.4",
    "prometheus-client>=0.20.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "python-multipart>=0.0.20",
]



[project.scripts]
maidere = "maidere:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
