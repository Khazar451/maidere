# Auxiliary services for Maidere (SearXNG metasearch, Prometheus, Grafana).
#
# Secrets are read from the project .env file (docker compose loads it
# automatically). Copy .env.example to .env and set:
#   SEARXNG_SECRET          random string, e.g. `openssl rand -hex 32`
#   GRAFANA_ADMIN_PASSWORD  Grafana admin password
# Compose refuses to start if either is missing.
#
# `docker compose up -d` starts only the sidecars.
# `docker compose --profile app up -d` also starts Maidere and Ollama.
# On a machine with an NVIDIA GPU, add the GPU file:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile app up -d
#
# Inside the Maidere container the API listens on 0.0.0.0. The published port
# is bound to 127.0.0.1 on the host. The access token is written to the
# maidere_data volume at /data/api-token on first start.

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: maidere-searxng
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env (e.g. openssl rand -hex 32)}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: maidere-prometheus
    network_mode: host
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=1GB"
      - "--web.listen-address=127.0.0.1:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: maidere-grafana
    network_mode: host
    environment:
      - GF_SERVER_HTTP_ADDR=127.0.0.1
      - GF_SERVER_HTTP_PORT=3000
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  ollama:
    profiles: ["app"]
    image: ollama/ollama:latest
    container_name: maidere-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  maidere:
    profiles: ["app"]
    build: .
    image: maidere:local
    container_name: maidere-app
    depends_on:
      - searxng
      - ollama
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_TOKEN: ${API_TOKEN:-}
      API_TOKEN_FILE: /data/api-token
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      SEARXNG_URL: http://searxng:8080
      MAIDERE_DATA_DIR: /data
      MAIDERE_RUNTIME_ROOT: /data
      TOOL_SANDBOX_MODE: restricted
    volumes:
      - maidere_data:/data
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  ollama_data:
  maidere_data:
