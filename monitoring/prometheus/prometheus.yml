global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "maidere-agent"
    metrics_path: "/metrics"
    # Prometheus runs with network_mode: host (see docker-compose.yml), so it
    # reaches the loopback-bound API directly. /metrics accepts loopback
    # scrapes without a token (METRICS_ALLOW_LOOPBACK=true). To scrape from a
    # remote Prometheus instead, add:
    #   authorization:
    #     credentials_file: /etc/prometheus/maidere_token
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels:
          app: "maidere"
          env: "local"
