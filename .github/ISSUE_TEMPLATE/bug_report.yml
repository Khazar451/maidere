name: Bug Report
description: File a bug report or regression in Maidere
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please provide a clear and concise description of the bug.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened?
      placeholder: Describe the issue in detail.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Start Maidere with `./launch.sh`
        2. Send query '...'
        3. Observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Diagnostics
      description: Output from terminal or structured logs (sanitize any private data).
      render: shell
