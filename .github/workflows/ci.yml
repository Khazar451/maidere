name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    name: Lint, types, build, audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Mypy (security boundary)
        run: uv run mypy

      - name: Build the wheel
        run: uv build --wheel

      - name: Audit dependencies
        # Audit the project environment itself. Exporting a requirements file
        # and reinstalling it makes pip-audit pick an older interpreter.
        run: uv run --with pip-audit pip-audit

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is not in the matrix until sqlite-vec and fastembed publish
        # wheels for it. requires-python already allows it.
        python-version: ["3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (bubblewrap for tool sandbox tests)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          bwrap --version

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ensure runtime directories
        run: mkdir -p db logs workspace

      - name: Run tests with coverage
        env:
          HF_HUB_OFFLINE: "1"
        run: uv run pytest --cov=maidere --cov-report=term-missing --cov-fail-under=75
